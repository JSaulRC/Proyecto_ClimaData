name: Ranking de Bochorno

on:
  schedule:
    - cron: '0 16 * * *' # 11:00 AM Perú (Cuando el sol es más fuerte)
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install requests tweepy pandas
    - env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      run: python src/post_02_ranking_bochorno.py
