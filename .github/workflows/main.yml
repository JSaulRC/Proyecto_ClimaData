name: Pipeline ClimaData Automatizado

on:
  schedule:
    # Ejecuta a las 12:00 UTC (07:00 AM hora de Perú) todos los días
    - cron: '0 12 * * *'
  workflow_dispatch: # Te permite un botón de ejecución manual para pruebas

jobs:
  extraccion_diaria:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Ejecutar extracción de datos
      env:
        # Variables de entorno listas para cuando conectemos la API de X
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      run: |
        python extraccion_clima.py
